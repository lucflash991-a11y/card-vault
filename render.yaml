services:
  - type: web
    name: card-vault
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: FIREBASE_WEB_CONFIG
        sync: false
      - key: APPLE_AUTH_ENABLED
        value: "false"

      - key: FIREBASE_PROJECT_ID
        value: card-vault-1de81
